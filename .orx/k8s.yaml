apiVersion: batch/v1
kind: Job
metadata:
  name: sol-attn-{{ORX_RUN}}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: nvcr.io/nvidia/pytorch:25.06-py3
          command: ["bash", "-c", "$ORX_SCRIPT"]
          resources:
            requests:
              nvidia.com/gpu: "4"
              cpu: "16"
              memory: "96Gi"
            limits:
              nvidia.com/gpu: "4"
              cpu: "16"
              memory: "96Gi"
